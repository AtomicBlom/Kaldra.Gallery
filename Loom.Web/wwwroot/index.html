<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Relative base so the app works from itch.io's unpredictable sub-path (and from a local server). -->
  <base href="./" />
  <title>Loom — WebGPU triangle</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #14141a; color: #d8d8e0;
                 font-family: system-ui, sans-serif; overflow: hidden; }
    #loom-canvas { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; left: 10px; bottom: 8px; font-size: 12px; opacity: 0.65;
               white-space: pre-wrap; max-width: 90vw; max-height: 40vh; overflow-y: auto; }
    #status.status-error { background: rgba(20, 12, 14, 0.9); border: 1px solid rgba(255, 100, 100, 0.5);
               border-radius: 4px; padding: 8px 10px; color: #ffb0b0; }
  </style>
  <script type='module' src="main#[.{fingerprint}].js"></script>
</head>

<body>
  <canvas id="loom-canvas"></canvas>
  <div id="status">loading .NET runtime…</div>
</body>

</html>
