name: Software rasterizer (WARP) capture

# A GPU-less regression net for the tracked demos. A runner without a GPU can't produce the golden-image and
# cross-backend parity captures (GalleryGoldenTests / GalleryParityTests need a real GPU and SKIP without one). Any
# Windows host ships WARP (Microsoft's software D3D12 rasterizer) out of the box, so the in-process
# GallerySoftwareAdapterTests forces the DirectX12 backend onto it (EngineSettings.PreferSoftwareAdapter) and asserts
# each tracked demo actually renders something — a colorcount SMOKE test, not a pixel-parity gate. It catches "a demo
# crashes or renders black under software rasterization" without a GPU. See docs/ci-software-rasterizer.md for the
# recipe, the fidelity measurement, and the deferred parity-baseline decision.
#
# The test renders offscreen (Surface.Offscreen — no window): the runner has no interactive desktop for GLFW to open
# one on (and as a service it never will — Session 0 has no desktop), so verification must be windowless. It replaced
# an earlier approach that drove the sandbox with --headless/--capture; those flags never graduated onto the reusable
# desktop host (capture is a test concern, not a production-host one), so the smoke lives in a test now.
#
# Run in Release: the D3D12 debug layer's GPU-based validation (default-on in Debug — DirectX12EngineSettings.
# GpuBasedValidation) patches shaders in a way WARP does not reliably support and can crash the process outright.
# (GallerySoftwareAdapterTests also forces it off explicitly, so this is belt-and-suspenders.)

on:
  pull_request:
  workflow_dispatch:

jobs:
  warp-capture:
    # Self-hosted Windows runner (WARP is part of the Windows SDK, so any Windows host has it), which keeps this
    # off GitHub-hosted minutes.
    # SECURITY: safe only while this repo is PRIVATE. Before making it public, remove the self-hosted runner (a
    # fork's PR could otherwise run arbitrary code on it) and switch back to `runs-on: windows-latest`.
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v7

      # Loom.Tests references the SUIsei submodule (via Loom.Gallery / Loom.UI.SUIsei) and, via the Vulkan backend,
      # VMASharp — both submodules are needed to build the tests. SUIsei is private; fetch it with a PAT that has
      # contents:read on AtomicBlom/SUIsei.
      - name: Checkout submodules (PAT for private SUIsei)
        env:
          GH_PAT: ${{ secrets.PAT }}
        shell: bash
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Loom.Tests/Loom.Tests.csproj

      - name: Build (Release)
        run: dotnet build Loom.Tests/Loom.Tests.csproj -c Release --no-restore

      # GallerySoftwareAdapterTests brings each tracked demo up offscreen on DirectX12 forced onto WARP and asserts a
      # non-empty colorcount. The test SKIPs (green) if DirectX12 isn't available at all (a non-Windows box); on this
      # Windows runner WARP is always present, so it runs. A demo that crashes or renders black fails the job.
      - name: Software-rasterizer (WARP) smoke over the tracked demos
        run: dotnet run --project Loom.Tests -c Release --no-build -- --treenode-filter "/*/*/GallerySoftwareAdapterTests/*"
