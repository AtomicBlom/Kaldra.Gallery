name: Software rasterizer (WARP) capture

# A GPU-less regression net for the tracked demos. A runner without a GPU can't produce the golden-image and
# cross-backend parity captures (GalleryGoldenTests / GalleryParityTests need a real GPU and SKIP without one). Any
# Windows host ships WARP (Microsoft's software D3D12 rasterizer) out of the box, so the in-process
# GallerySoftwareAdapterTests forces the DirectX12 backend onto it (EngineSettings.PreferSoftwareAdapter) and asserts
# each tracked demo actually renders something: a colorcount SMOKE test, not a pixel-parity gate. It catches "a demo
# crashes or renders black under software rasterization" without a GPU.
#
# The test renders offscreen (Surface.Offscreen, no window), so a runner with no interactive desktop can run it.
#
# Run in Release: the D3D12 debug layer's GPU-based validation (default-on in Debug) patches shaders in a way WARP does
# not reliably support and can crash the process outright. (GallerySoftwareAdapterTests also forces it off.)
#
# A GitHub-hosted Windows runner, so a pull request runs nothing on a machine of ours. The gallery builds on the engine,
# Vysara and Sirrow from checkouts beside it (build/Sources.props), which this lays out as siblings. All three are
# public, so the workflow's own token checks them out, for a fork's pull request too.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp-capture:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: Kaldra.Gallery

      - name: Check out the engine (its VMASharp submodule too)
        uses: actions/checkout@v4
        with:
          repository: AtomicBlom/Kaldra
          path: Kaldra
          submodules: recursive

      - name: Check out Vysara
        uses: actions/checkout@v4
        with:
          repository: AtomicBlom/Vysara
          path: Vysara

      - name: Check out Sirrow
        uses: actions/checkout@v4
        with:
          repository: AtomicBlom/Sirrow
          path: Sirrow

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build (Release)
        working-directory: Kaldra.Gallery
        run: dotnet build Kaldra.Gallery.Tests/Kaldra.Gallery.Tests.csproj -c Release

      # GallerySoftwareAdapterTests brings each tracked demo up offscreen on DirectX12 forced onto WARP and asserts a
      # non-empty colorcount. A demo that crashes or renders black fails the job.
      - name: Software-rasterizer (WARP) smoke over the tracked demos
        working-directory: Kaldra.Gallery
        run: dotnet run --project Kaldra.Gallery.Tests -c Release --no-build -- --treenode-filter "/*/*/GallerySoftwareAdapterTests/*"
