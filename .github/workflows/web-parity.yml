name: WebGPU pixel parity

# The browser backend's parity leg: render a demo on Vulkan in-process and on WebGPU in a headless browser, and
# diff the two at the same 4/255 + 0.5% bar the desktop Vulkan↔DirectX12 pairing uses. Until this existed, WebGPU
# pixel drift was caught by eye, if at all. See docs/webgpu-parity.md.
#
# NOT on every pull request, unlike the other GPU workflow: publishing the wasm app is minutes of AOT compilation
# on top of the usual build, and the job needs a GPU AND a browser on the runner. Nightly plus manual dispatch
# keeps drift bounded to a day without taxing every push.
#
# WebGpuParityTests SKIPs — and tools/web-parity.ps1 reports success — when the runner has no Vulkan device, no
# Chromium, or no publish. So a runner that cannot do this reports honestly instead of failing.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  web-parity:
    # Self-hosted Windows runner: the leg needs a real GPU for the Vulkan reference and a Chromium for the WebGPU
    # subject, and the shader build needs the Windows-only Slang/DXC toolchain (see ci.yml).
    # SECURITY: safe only while this repo is PRIVATE. Before making it public, remove the self-hosted runner (a
    # fork's PR could otherwise run arbitrary code on it) and switch back to a hosted runner.
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v7

      # Loom.Tests references the SUIsei submodule (via Loom.Gallery / Loom.UI.SUIsei) and, via the Vulkan backend,
      # VMASharp — both are needed to build the tests. SUIsei is private; fetch it with a PAT that has
      # contents:read on AtomicBlom/SUIsei.
      - name: Checkout submodules (PAT for private SUIsei)
        env:
          GH_PAT: ${{ secrets.PAT }}
        shell: bash
        run: |
          git config --global url."https://${GH_PAT}@github.com/".insteadOf "https://github.com/"
          git submodule update --init --recursive

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Loom.Web builds through Microsoft.NET.Sdk.WebAssembly, which needs the browser-wasm runtime packs. Without
      # the workload the publish fails at restore, so install it before anything tries to build the web host.
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      # The same local shader cache the other workflows use — all jobs run on this runner and compile the same
      # shaders, so whichever lands first spares the others the compile. See tools/shader-cache.ps1.
      - name: Restore shader cache
        id: shader-cache
        shell: pwsh
        run: pwsh tools/shader-cache.ps1 -Mode restore

      - name: Build (engine + backends + tests)
        run: dotnet build Loom.Tests/Loom.Tests.csproj -c Release

      - name: Save shader cache
        if: steps.shader-cache.outputs.hit != 'true'
        shell: pwsh
        run: pwsh tools/shader-cache.ps1 -Mode save

      # Publishes Loom.Web, then runs WebGpuParityTests against it. The wrapper owns the publish because the test
      # deliberately does not: Loom.Tests must not reference Loom.Web, or the wasm SDK would follow it into every
      # desktop test run.
      - name: WebGPU vs Vulkan pixel parity
        shell: pwsh
        run: pwsh tools/web-parity.ps1
