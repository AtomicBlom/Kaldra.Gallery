name: WebGPU pixel parity

# The browser backend's parity leg: render a demo on Vulkan in-process and on WebGPU in a headless browser, and diff
# the two at the same 4/255 + 0.5% bar the desktop Vulkan-DirectX12 pairing uses. See the engine's docs/webgpu-parity.md.
#
# Nightly and on manual dispatch only: publishing the wasm app is minutes of AOT compilation on top of the usual build,
# and the job needs a GPU AND a browser on the runner.
#
# WebGpuParityTests SKIPs (and tools/web-parity.ps1 reports success) when the runner has no Vulkan device, no Chromium,
# or no publish, so a runner that cannot do this reports honestly instead of failing.

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-parity:
    # A self-hosted Windows runner, registered to this repository: the leg needs a real GPU for the Vulkan reference and
    # a Chromium for the WebGPU subject. SECURITY: this repository is public, so this workflow must never run on
    # pull_request (a fork's would run its own code on the runner). The schedule and a dispatch run master, and only
    # someone with write access can dispatch.
    runs-on: [self-hosted, windows]

    steps:
      - uses: actions/checkout@v4
        with:
          path: Kaldra.Gallery

      # The gallery builds on the engine and Sirrow from checkouts beside it (build/Sources.props). The engine's
      # repository is private: its checkout, and its SUIsei submodule's, take the PAT secret (contents:read on
      # AtomicBlom/Loom and AtomicBlom/SUIsei).
      - name: Check out the engine (its SUIsei submodule too)
        uses: actions/checkout@v4
        with:
          repository: AtomicBlom/Loom
          path: Kaldra
          token: ${{ secrets.PAT }}
          submodules: recursive

      - name: Check out Sirrow
        uses: actions/checkout@v4
        with:
          repository: AtomicBlom/Sirrow
          path: Sirrow

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      # Loom.Web builds through Microsoft.NET.Sdk.WebAssembly, which needs the browser-wasm runtime packs
      - name: Install the wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Build (engine + backends + tests)
        working-directory: Kaldra.Gallery
        run: dotnet build Loom.Gallery.Tests/Loom.Gallery.Tests.csproj -c Release

      # Publishes Loom.Web, then runs WebGpuParityTests against it. The wrapper owns the publish because the test does
      # not: Loom.Gallery.Tests must not reference Loom.Web, or the wasm SDK would follow it into every desktop test run.
      - name: WebGPU vs Vulkan pixel parity
        working-directory: Kaldra.Gallery
        shell: pwsh
        run: pwsh tools/web-parity.ps1
